name: BioKB 主线验证
on:
  push:
    paths: ["src/**", "tests/biokb/**", "scripts/**", "docs/**", "examples/**", "questionbank/**", "config/**", "research/**", "*.py", "*.md", "*.toml", "requirements.txt", ".gitattributes", ".github/workflows/biokb.yml"]
  pull_request:
    paths: ["src/**", "tests/biokb/**", "scripts/**", "docs/**", "examples/**", "questionbank/**", "config/**", "research/**", "*.py", "*.md", "*.toml", "requirements.txt", ".gitattributes", ".github/workflows/biokb.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: 安装声明依赖
        run: python -m pip install -e ".[dev,local-embedding]"
      - name: 代码检查与主线测试
        run: |
          python -m ruff check src/biokb tests/biokb scripts
          python -m ruff format --check src/biokb tests/biokb scripts
          python -m pytest -q
      - name: 冻结题库与离线复现
        run: |
          python scripts/audit_questionbank.py --output output/ci-questionbank
          python scripts/reproduce_demo.py --output output/ci-demo
      - name: 安装独立浏览器
        if: matrix.python-version == '3.12'
        run: |
          python -m pip install -e ".[browser]"
          python -m playwright install --with-deps chromium
      - name: 浏览器流程与源码打包
        if: matrix.python-version == '3.12'
        run: |
          python scripts/verify_browser.py --output output/ci-browser
          python scripts/verify_workspace.py --output output/ci-workspace
          python scripts/verify_research.py --output output/ci-research
          python scripts/verify_literature.py --output output/ci-literature
          python scripts/verify_answer_quality.py --output output/ci-answer-quality
          python scripts/package_source.py --output output/distributions/BioKB-ci.zip
          python scripts/verify_package.py output/distributions/BioKB-ci.zip
      - name: 保留验证报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: biokb-validation-${{ matrix.python-version }}
          path: |
            output/**/report.json
            output/**/audit.json
            output/**/reproduction.json
          if-no-files-found: ignore
